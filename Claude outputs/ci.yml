name: CI

# Phase 12 Task 6 — release-pipeline parity. This workflow runs the same critical checks the project requires locally
# (see backend-api/docs/RELEASE_AND_RECOVERY.md), on GitHub Actions because the origin remote is github.com.
#
# Jobs:
#   backend-sqlite     release-safety gate, full SQLite suite, fresh-SQLite migration rehearsal
#   backend-mariadb    full suite on a fresh MariaDB, MariaDB migration rehearsal, dump -> restore -> ops:verify-restore,
#                      and the concurrency / inbound-gate / outbound-pacing probes
#   frontend-app       tsc, Vitest, production build
#   qr-engine-service  syntax check (unchanged)
#
# Every database used here is a THROWAWAY (name contains "throwaway") on the job's own service container.
# Nothing in this file connects to a real environment, and no secret is used: APP_KEY is generated per run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-sqlite:
    name: backend-api (SQLite suite + migration rehearsal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, json, openssl, tokenizer, xml
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Release-safety gate (fast fail)
        run: php artisan test --group=release-safety

      - name: Full test suite (SQLite)
        run: php artisan test

      - name: Migration rehearsal (fresh SQLite, in memory)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan ops:rehearse-migrations --seed

  backend-mariadb:
    name: backend-api (MariaDB suite, rehearsal, restore, probes)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend-api
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pdo_mysql, bcmath, ctype, fileinfo, json, openssl, tokenizer, xml
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Create throwaway databases
        run: |
          for db in wa_throwaway_ci wa_throwaway_rehearsal wa_throwaway_src wa_throwaway_restored wa_throwaway_test; do
            mysql -h127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS ${db}; CREATE DATABASE ${db};"
          done

      - name: Full test suite (fresh MariaDB)
        env:
          DB_CONNECTION: mariadb
          DB_DATABASE: wa_throwaway_ci
        run: php artisan test

      - name: Migration rehearsal (MariaDB)
        env:
          DB_CONNECTION: mariadb
          DB_DATABASE: wa_throwaway_rehearsal
        run: php artisan ops:rehearse-migrations --seed

      - name: Backup -> restore -> verify (throwaway databases only)
        env:
          DB_CONNECTION: mariadb
          DB_DATABASE: wa_throwaway_src
        run: |
          php artisan migrate:fresh --seed --force
          mysqldump -h127.0.0.1 -uroot -proot --single-transaction --routines --triggers wa_throwaway_src \
            | mysql -h127.0.0.1 -uroot -proot wa_throwaway_restored
          php artisan ops:verify-restore --database=wa_throwaway_restored
          php artisan ops:check-recovery --skip-database

      # The probes refuse any database not named exactly wa_throwaway_test (their own guard) and run migrate:fresh on it;
      # they run one after another on that single throwaway database.
      - name: Journey concurrency probe
        env:
          DB_CONNECTION: mariadb
          DB_DATABASE: wa_throwaway_test
          QUEUE_CONNECTION: sync
        run: php tests/Probes/journey_concurrency_probe.php

      - name: Inbound gate non-blocking probe
        env:
          DB_CONNECTION: mariadb
          DB_DATABASE: wa_throwaway_test
        run: php tests/Probes/inbound_gate_nonblocking_probe.php

      - name: Outbound pacing probe
        env:
          DB_CONNECTION: mariadb
          DB_DATABASE: wa_throwaway_test
          QUEUE_CONNECTION: database
        run: php tests/Probes/outbound_pacing_probe.php

  frontend-app:
    name: frontend-app (tsc, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

  qr-engine-service:
    name: qr-engine-service (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qr-engine-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qr-engine-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every source file
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
