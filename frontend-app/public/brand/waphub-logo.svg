<svg xmlns="http://www.w3.org/2000/svg" width="928" height="256" viewBox="0 0 232 64" fill="none">
  <title>WapHub</title>
  <defs>
    <linearGradient id="wh-bg" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="wh-shine" x1="32" y1="0" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#wh-bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#wh-shine)"/>
  <!-- Chat bubble -->
  <path d="M32 12.5c10.5 0 19 7.9 19 17.8S42.5 48 32 48c-2.6 0-5.1-.5-7.4-1.4L15.5 50l2.7-8.1A17.2 17.2 0 0 1 13 30.3c0-9.9 8.5-17.8 19-17.8z" fill="#ffffff"/>
